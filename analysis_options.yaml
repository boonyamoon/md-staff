# Lints for md-staff. flutter_lints is the baseline; the extras below are the rules that
# actually bite in this app: an unawaited future in an order send, a missing await, or a
# BuildContext used after a dialog closes.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Codegen output is checked in; never fail analysis on its formatting.
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_void_async
    - await_only_futures
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_await_in_return
    - use_build_context_synchronously
